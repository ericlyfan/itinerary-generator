name: itinerary_generator
description: "An travel itinerary generator app"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_datepicker: ^28.2.9
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  path_provider: ^2.1.1
  flutter_dotenv: ^5.0.2
  intl: ^0.20.2
  http: ^1.3.0
  google_generative_ai: ^0.4.6
  supabase_flutter: ^2.8.4
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.2.10
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - .env
    - assets/images/
  uses-material-design: true

flutter_native_splash:
  color: "#F5F5F5"
  ios: true
  image: assets/images/intellinary_splash.png
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/intellinary_icon.png"
